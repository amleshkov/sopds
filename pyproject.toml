[project]
name = "sopds"
version = "0.47.1"
description = "SimpleOPDS catalog server (modernized fork)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-constance>=4.4",
    "pillow>=11",
    "apscheduler>=3.11",
    "lxml>=5",
    "psycopg2-binary>=2.9",
    "gunicorn>=23",
    "whitenoise>=6",
]

[dependency-groups]
dev = [
    "coverage>=7.17",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
exclude = ["opds_catalog/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W605"]

[tool.ruff.lint.per-file-ignores]
"opds_catalog/settings.py" = ["E402"]
"scripts/migrate_constance_legacy.py" = ["E402"]
"book_tools/pymobi/__init__.py" = ["F401", "F403"]
"book_tools/format/__init__.py" = ["F403"]

[tool.coverage.run]
source = ["opds_catalog", "sopds", "sopds_web_backend", "book_tools", "scripts"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = false
